schema_version = 1
as_of = "2026-08-30"

[states.designed]
label = "Designed"
definition = "Behavior and safety boundaries are specified, but an operator-usable implementation is not present."

[states.implemented]
label = "Implemented"
definition = "The capability is present in code; complete automated behavior coverage is not yet recorded."

[states.automated_tested]
label = "Automated-tested"
definition = "Unit, integration, acceptance, or browser tests exercise the capability and its important failure boundaries."

[states.simulated]
label = "Simulated"
definition = "The complete workflow passed with simulated clocks, radios, providers, peers, or failures; a relevant field gate remains open."

[states.single_node_field_tested]
label = "Single-node field-tested"
definition = "A recorded run passed on one physical Outpost or its attached field hardware."

[states.two_node_field_tested]
label = "Two-node field-tested"
definition = "A recorded workflow passed between two physical Outposts, including the stated transport and recovery conditions."

[states.hardware_gated]
label = "Hardware-gated"
definition = "A capability-specific hardware acceptance gate passed on the recorded target; broader soak or deployment gates may remain."

[states.production_ready]
label = "Production-ready"
definition = "A release decision explicitly accepted all required safety, compatibility, recovery, field, and operational evidence."

