name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -c requirements.lock '.[dev]'
      - run: python tools/check_capabilities.py --check
      - run: sh deploy/smoke-package.sh
      - run: mkdir dist && python -m pip wheel --no-deps --wheel-dir dist .
      - run: >-
          python tools/build_release_metadata.py --wheel dist/outpost-*.whl
          --commit "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
          --output dist/RELEASE-METADATA.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/outpost.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - run: >-
          cd dist && sha256sum outpost-*.whl RELEASE-METADATA.json outpost.spdx.json
          > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Bind SBOM to wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/outpost-*.whl
          sbom-path: dist/outpost.spdx.json
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
