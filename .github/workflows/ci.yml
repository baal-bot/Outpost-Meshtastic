name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,radio]'
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy
      - run: pytest --cov=outpost --cov-report=term
      - run: sh -n deploy/install.sh deploy/smoke-package.sh
      - run: sh deploy/smoke-package.sh
      - run: pip-audit
