name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    # #143's full Python 3.12 coverage run alone took 28 minutes. Preserve the
    # production rerun/package/audit gates as #145 adds real recovery/browser cases.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev,radio]'
      - run: python -m playwright install --with-deps chromium
      - run: >-
          ruff format --check src tests tools/build_release_metadata.py tools/benchmark_commit_policy.py
          tools/eval_ai.py tools/bench_inference.py
          tools/check_capabilities.py tools/check_commands.py tools/check_ci_evidence.py
          tools/check_dependency_lock.py tools/check_requirements.py
          tools/check_mypy_ratchet.py tools/check_static_markup.py tools/pytest_evidence_plugin.py
          tools/verify_release.py deploy/configure.py deploy/render_avahi.py deploy/offline_kit.py
      - run: >-
          ruff check src tests tools/build_release_metadata.py tools/benchmark_commit_policy.py
          tools/eval_ai.py tools/bench_inference.py
          tools/check_capabilities.py tools/check_commands.py tools/check_ci_evidence.py
          tools/check_dependency_lock.py tools/check_requirements.py
          tools/check_mypy_ratchet.py tools/check_static_markup.py tools/pytest_evidence_plugin.py
          tools/verify_release.py deploy/configure.py deploy/render_avahi.py deploy/offline_kit.py
      - run: mypy
      - run: python tools/check_mypy_ratchet.py
      - run: python tools/check_capabilities.py --check
      - run: python -m tools.check_requirements --check
      - run: python tools/check_commands.py --check
      - run: python tools/check_static_markup.py
      - run: pytest --cov=outpost --cov-report=term --cov-report=json:coverage.json
      - run: >-
          pytest -m production_wiring --cov=outpost --cov-report=json:production-coverage.json
      - run: >-
          python tools/check_critical_coverage.py coverage.json
          --production-report production-coverage.json
      - run: >-
          sh -n deploy/install.sh deploy/install-test-host.sh deploy/health_probe.sh
          deploy/rollback.sh deploy/update.sh
          deploy/smoke-package.sh tools/pre-push.sh
      - run: >-
          python -m py_compile tools/check_ci_evidence.py tools/check_dependency_lock.py
          tools/eval_ai.py tools/bench_inference.py
          tools/benchmark_commit_policy.py
          tools/check_requirements.py
          tools/check_mypy_ratchet.py tools/check_static_markup.py tools/pytest_evidence_plugin.py
          deploy/configure.py deploy/render_avahi.py deploy/offline_kit.py
      - run: sh deploy/smoke-package.sh
      - if: matrix.python-version == '3.13'
        run: pip-audit

  locked-runtime:
    runs-on: ubuntu-24.04
    # #139's slower Python 3.12 runner reached the 40-minute limit at 86%.
    # Keep the full suite, audit and package checks with enough time to finish.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -c requirements.lock '.[radio]'
      - run: python tools/check_dependency_lock.py --check-installed
      - if: matrix.python-version == '3.13'
        run: python tools/check_dependency_lock.py --report-stale
      - run: pip install -c requirements.lock '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest
      - if: matrix.python-version == '3.13'
        run: pip-audit --strict --no-deps --requirement requirements.lock
      - if: matrix.python-version == '3.13'
        run: sh deploy/smoke-package.sh
