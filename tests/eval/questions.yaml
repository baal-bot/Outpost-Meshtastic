# Hardware-gated Phase 2 corpus. Expected behavior is intentionally semantic, not exact text.
- id: kb-01
  question: when is the transfer station open
  class: local_knowledge
  setup: {kb: {ref: "kb:transfer-station", body: "Open Sat 8-4 and Wed 12-6."}}
  expect: {grounded: true, cites_any: ["kb:transfer-station"], must_contain_any: [Sat, Wed], max_bytes: 200}
